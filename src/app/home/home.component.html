<section class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content container">
        <h1 class="hero-title">{{ name() }}</h1>
        <h2 class="hero-subtitle">{{ 'home.heroTitle' | translate }}</h2>
        <p class="hero-tagline">{{ 'home.heroTagline' | translate }}</p>

        <div class="hero-actions">
            <a routerLink="/projects" pButton severity="secondary"
                styleClass="hero-btn primary" [outlined]="false">
                <span pButtonLabel>{{ 'home.heroProjects' | translate }}</span>
            </a>
            <a routerLink="/about-me" pButton severity="secondary" styleClass="hero-btn secondary"
                [outlined]="true">
                <span pButtonLabel>{{ 'home.heroAbout' | translate }}</span>
            </a>
        </div>
    </div>
</section>
