<section class="projects section">
  <div class="container">
    <h2 class="section-title fade-in">Mes Projets</h2>
    <p class="section-subtitle fade-in">Voici une sélection de mes projets récents.</p>
    
    <div class="projects-grid">
      @for (project of projects; track project.id) {
        <mat-card class="project-card fade-in" [style.animation-delay]="getAnimationDelay(project.id)">
          <img mat-card-image [src]="project.image" alt="{{ project.title }}" class="project-image" />
          
          <mat-card-header>
            <mat-card-title>{{ project.title }}</mat-card-title>
            <mat-card-subtitle>
              @for (tag of project.tags; track tag) {
                <mat-chip class="tag" color="accent" selected>{{ tag }}</mat-chip>
              }
            </mat-card-subtitle>
          </mat-card-header>
          
          <mat-card-content>
            <p>{{ project.description }}</p>
          </mat-card-content>
          
          <mat-card-actions>
            @for (link of project.links; track link.url) {
              <a [href]="link.url" target="_blank" rel="noopener noreferrer" mat-raised-button color="primary">
                <mat-icon>{{ link.icon }}</mat-icon>
                {{ link.label }}
              </a>
            }
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </div>
</section>
