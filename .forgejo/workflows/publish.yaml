name: Publish
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: codeberg-small

    steps:
      - name: checkout
        uses: actions/checkout@v5
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Deploy to Codeberg Pages
        uses: actions/git-pages@v2
        with:
          site: https://tvelu77.codeberg.page/
          token: ${{ secrets.GIT_PAGES_TOKEN }}
          source: dist/portfolio/browser/